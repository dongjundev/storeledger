spring.application.name=storeledger

# H2 file DB: data is kept in ./data/storeledger.mv.db between restarts
spring.datasource.url=jdbc:h2:file:./data/storeledger
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/storeledger, user: sa)
spring.h2.console.enabled=true

# 앱을 업데이트해도 브라우저가 캐시해 둔 옛 화면(app.js)을 쓰지 않도록, 정적 파일은 매번 바뀌었는지 확인한다
spring.web.resources.cache.cachecontrol.no-cache=true
# 옛 화면이 보내는 모르는 필드(예: 예전 feeRate)를 조용히 무시하지 말고 400으로 알린다
spring.jackson.deserialization.fail-on-unknown-properties=true

# 화면 제목·로고에 표시할 상호. 실제 상호는 git에 제외된 ./config/application.properties 에 적어 덮어쓴다.
app.store-name=Store Ledger
