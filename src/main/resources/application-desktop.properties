# Mac 앱(jpackage) 실행 모드. DesktopLauncher 가 app.home(~/StoreLedger)과 server.port(28080)를 넣고 이 프로필을 켠다.
# 같은 컴퓨터에서만 접속되게 127.0.0.1에만 바인딩한다.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:${app.home}/data/storeledger
logging.file.name=${app.home}/logs/app.log
# H2 콘솔은 SQL과 Java 코드까지 실행할 수 있는 개발 도구라 앱에서는 끈다
spring.h2.console.enabled=false
