# 배포용 프로필: SPRING_PROFILES_ACTIVE=prod 로 실행하면 이 설정이 application.properties 위에 덮어씌워진다.
# DB 접속 정보는 파일에 적지 않고 환경변수(DB_HOST, DB_USER, DB_PASSWORD)로 받는다.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/storeledger
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
